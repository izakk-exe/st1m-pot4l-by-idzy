<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ST1M PORT4L by idZy — Apex Legends config editor and Movement Lab">
  <defs>
    <radialGradient id="bgGlow" cx="76%" cy="48%" r="60%">
      <stop offset="0" stop-color="#4a3500" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#1c1300" stop-opacity=".6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ffd966" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#ffbe32" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 .45  0 .78 0 0 .25  0 0 .12 0 0  0 0 0 1.4 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .ttl { font-family: Bahnschrift, 'Segoe UI Variable Display', 'Segoe UI', 'Arial Black', sans-serif; font-weight: 800; }
      .sub { font-family: Bahnschrift, 'Segoe UI', Arial, sans-serif; font-weight: 600; letter-spacing: 7px; }
      .tag { font-family: Bahnschrift, 'Segoe UI', Arial, sans-serif; font-weight: 500; }
      .spin { transform-origin: 1180px 175px; animation: spin 38s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse2 { animation: pulse2 3.2s ease-in-out infinite; }
      @keyframes pulse2 { 0%,100% { opacity: .92; } 50% { opacity: 1; } }
      .tw { animation: tw 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#000"/>
  <rect width="1280" height="360" fill="url(#bgGlow)"/>

  <!-- stars -->
  <g fill="#fff4d6">
    <circle class="tw" style="animation-delay:.1s" cx="90" cy="48" r="1.4"/><circle class="tw" style="animation-delay:1.2s" cx="210" cy="300" r="1.2"/>
    <circle class="tw" style="animation-delay:.7s" cx="420" cy="36" r="1.6"/><circle class="tw" style="animation-delay:1.9s" cx="560" cy="318" r="1.1"/>
    <circle class="tw" style="animation-delay:.4s" cx="700" cy="70" r="1.3"/><circle class="tw" style="animation-delay:2.2s" cx="820" cy="330" r="1.5"/>
    <circle class="tw" style="animation-delay:1.5s" cx="1130" cy="40" r="1.4"/><circle class="tw" style="animation-delay:.9s" cx="1230" cy="290" r="1.2"/>
    <circle class="tw" style="animation-delay:2.4s" cx="1180" cy="120" r="1"/><circle class="tw" style="animation-delay:1.1s" cx="330" cy="150" r="1"/>
  </g>

  <!-- black hole + accretion disk -->
  <g opacity=".95">
    <g class="spin" filter="url(#soft)">
      <ellipse cx="1180" cy="175" rx="300" ry="58" fill="none" stroke="url(#ring)" stroke-width="3" transform="rotate(-14 1180 175)" opacity=".5"/>
      <ellipse cx="1180" cy="175" rx="250" ry="46" fill="none" stroke="url(#ring)" stroke-width="5" transform="rotate(-14 1180 175)" opacity=".75"/>
      <ellipse cx="1180" cy="175" rx="215" ry="36" fill="none" stroke="url(#ring)" stroke-width="7" transform="rotate(-14 1180 175)"/>
      <ellipse cx="1180" cy="175" rx="165" ry="27" fill="none" stroke="url(#ring)" stroke-width="9" transform="rotate(-14 1180 175)"/>
    </g>
    <circle cx="1180" cy="175" r="68" fill="#000"/>
    <circle cx="1180" cy="175" r="70" fill="none" stroke="#ffd966" stroke-opacity=".55" stroke-width="2" filter="url(#blur6)" class="pulse"/>
  </g>

  <!-- logo -->
  <g transform="translate(26 22) scale(.64)">
  <defs>
    <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/><stop offset=".35" stop-color="#ffd966"/><stop offset=".7" stop-color="#f5c542"/><stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="lg-void" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#e9c9ff"/><stop offset=".45" stop-color="#9a3dff"/><stop offset=".8" stop-color="#3a0d78"/><stop offset="1" stop-color="#12032c"/>
    </radialGradient>
    <linearGradient id="lg-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e09a00"/>
    </linearGradient>
    <linearGradient id="lg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <filter id="lg-neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 .5  0 .78 0 0 .3  0 0 .1 0 0  0 0 0 1.5 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lg-violet" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feColorMatrix in="b" type="matrix" values=".8 0 0 0 .35  0 .1 0 0 0  0 0 1 0 .5  0 0 0 1.4 0" result="v"/>
      <feMerge><feMergeNode in="v"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lg-soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="lg-clipVoid"><ellipse cx="0" cy="0" rx="106" ry="166"/></clipPath>
  </defs>

  <g transform="translate(262 250) scale(.9) translate(-256 -256)">
  <!-- portal -->
  <g transform="translate(256 256) rotate(-18)">
    <ellipse rx="146" ry="208" fill="none" stroke="#a24bff" stroke-opacity=".55" stroke-width="14" filter="url(#lg-violet)"/>
    <ellipse rx="108" ry="168" fill="url(#lg-void)"/>
    <g clip-path="url(#lg-clipVoid)" fill="none" stroke-linecap="round" stroke="#fff">
      <path d="M-86 -120 C 20 -170 110 -60 70 40 C 40 110 -50 100 -64 30" stroke-width="7" stroke-opacity=".75"/>
      <path d="M-70 -60 C -20 -110 62 -80 58 -8 C 54 48 -16 60 -30 18" stroke-width="6" stroke-opacity=".7"/>
      <path d="M-50 90 C -10 130 70 130 92 70" stroke-width="5" stroke-opacity=".55"/>
      <path d="M40 -140 C 90 -90 96 -20 70 20" stroke-width="5" stroke-opacity=".5"/>
    </g>
    <ellipse rx="130" ry="190" fill="none" stroke="url(#lg-gold)" stroke-width="22" filter="url(#lg-neon)"/>
    <ellipse rx="116" ry="176" fill="none" stroke="#fff" stroke-width="3.5" stroke-opacity=".95"/>
  </g>

  <!-- stim injector (tip at the portal centre) -->
  <g transform="translate(282 232) rotate(-40)" filter="url(#lg-neon)">
    <!-- needle -->
    <polygon points="-72,-5 0,0 -72,5" fill="#fff"/>
    <rect x="-90" y="-12" width="20" height="24" rx="5" fill="url(#lg-gold)"/>
    <!-- barrel -->
    <rect x="-246" y="-31" width="158" height="62" rx="11" fill="rgba(255,255,255,.1)" stroke="url(#lg-glass)" stroke-width="5"/>
    <rect x="-236" y="-19" width="116" height="38" rx="6" fill="url(#lg-liquid)"/>
    <rect x="-236" y="-19" width="116" height="12" rx="6" fill="#fff" opacity=".35"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9">
      <line x1="-112" y1="-28" x2="-112" y2="-16"/><line x1="-136" y1="-28" x2="-136" y2="-20"/><line x1="-160" y1="-28" x2="-160" y2="-16"/><line x1="-184" y1="-28" x2="-184" y2="-20"/><line x1="-208" y1="-28" x2="-208" y2="-16"/>
    </g>
    <!-- flange, plunger rod and thumb pad -->
    <rect x="-262" y="-44" width="18" height="88" rx="8" fill="url(#lg-gold)"/>
    <rect x="-318" y="-8" width="60" height="16" rx="4" fill="#fff"/>
    <rect x="-340" y="-32" width="26" height="64" rx="12" fill="url(#lg-gold)"/>
  </g>
  </g>
</g>

  <!-- title -->
  <g filter="url(#glow)">
    <text class="ttl" x="384" y="176" font-size="88" fill="#fff" letter-spacing="9">ST1M PORT4L</text>
  </g>
  <rect x="388" y="196" width="540" height="3" fill="url(#line)" rx="2">
    <animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text class="sub" x="390" y="236" font-size="23" fill="#f5c542">BY IDZY</text>
  <text class="tag" x="390" y="280" font-size="21" fill="#e8e2d0">Apex Legends config editor  ·  Movement Lab  ·  Keyboard &amp; mouse overlay</text>
  <text class="tag" x="390" y="312" font-size="16" fill="#a39e90">FOV 120 · one-click setup · tap strafe · Superglide Trainer · before/after · 100% free</text>
</svg>
