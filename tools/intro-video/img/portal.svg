<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ST1M PORT4L logo: a stim injector entering a portal">
<defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/><stop offset=".35" stop-color="#ffd966"/><stop offset=".7" stop-color="#f5c542"/><stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="void" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#e9c9ff"/><stop offset=".45" stop-color="#9a3dff"/><stop offset=".8" stop-color="#3a0d78"/><stop offset="1" stop-color="#12032c"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e09a00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 .5  0 .78 0 0 .3  0 0 .1 0 0  0 0 0 1.5 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="violet" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feColorMatrix in="b" type="matrix" values=".8 0 0 0 .35  0 .1 0 0 0  0 0 1 0 .5  0 0 0 1.4 0" result="v"/>
      <feMerge><feMergeNode in="v"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="clipVoid"><ellipse cx="0" cy="0" rx="106" ry="166"/></clipPath>
  </defs>
  <g transform="translate(262 250) scale(.9) translate(-256 -256)">
  <!-- portal -->
  <g transform="translate(256 256) rotate(-18)">
    <ellipse rx="146" ry="208" fill="none" stroke="#a24bff" stroke-opacity=".55" stroke-width="14" filter="url(#violet)"/>
    <ellipse rx="108" ry="168" fill="url(#void)"/>
    <g clip-path="url(#clipVoid)" fill="none" stroke-linecap="round" stroke="#fff">
      <path d="M-86 -120 C 20 -170 110 -60 70 40 C 40 110 -50 100 -64 30" stroke-width="7" stroke-opacity=".75"/>
      <path d="M-70 -60 C -20 -110 62 -80 58 -8 C 54 48 -16 60 -30 18" stroke-width="6" stroke-opacity=".7"/>
      <path d="M-50 90 C -10 130 70 130 92 70" stroke-width="5" stroke-opacity=".55"/>
      <path d="M40 -140 C 90 -90 96 -20 70 20" stroke-width="5" stroke-opacity=".5"/>
    </g>
    <ellipse rx="130" ry="190" fill="none" stroke="url(#gold)" stroke-width="22" filter="url(#neon)"/>
    <ellipse rx="116" ry="176" fill="none" stroke="#fff" stroke-width="3.5" stroke-opacity=".95"/>
  </g>

  </g>
</svg>
